name: Deploy Content to sarahtestsentinel [3579a243-78ab-417e-a692-387df9d91e3c]
# Note: This workflow will deploy everything in the root directory.
# To deploy content only from a specific path (for example SentinelContent):
#   1. Add the target path to the "paths" property like such
#    paths:
#    - 'SentinelContent/**'
#    - '!.github/workflows/**'
#    - '.github/workflows/sentinel-deploy-3579a243-78ab-417e-a692-387df9d91e3c.yml'
#   2. Append the path to the directory environment variable below
#       directory: '${{ github.workspace }}/SentinelContent'

on:
  push:
    branches: [ copilot/sample-repo-for-microsoft-sentinel ]
    paths:
    - '**'
    - '!.github/workflows/**'  # this filter prevents other workflow changes from triggering this workflow
    - '.github/workflows/sentinel-deploy-3579a243-78ab-417e-a692-387df9d91e3c.yml'

jobs:
  deploy-content:
    runs-on: windows-latest
    env:
      resourceGroupName: 'sentineltest'
      workspaceName: 'sarahtestsentinel'
      workspaceId: 'd869c07e-593e-4f5b-b178-50f428232414'
      directory: '${{ github.workspace }}'
      cloudEnv: 'AzureCloud'
      contentTypes: 'AnalyticsRule,AutomationRule,HuntingQuery,Parser,Playbook,Workbook,CustomDetection,Watchlist'
      branch: 'copilot/sample-repo-for-microsoft-sentinel'
      sourceControlId: '3579a243-78ab-417e-a692-387df9d91e3c'
      rootDirectory: '${{ github.workspace }}'
      githubAuthToken: ${{ secrets.GITHUB_TOKEN }}
      smartDeployment: 'true'
    permissions:
      contents: write
      id-token: write # Require write permission to Fetch an OIDC token.

    steps:
    - name: Login to Azure (Attempt 1)
      continue-on-error: true
      id: login1
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_3579a24378ab417ea692387df9d91e3c }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_3579a24378ab417ea692387df9d91e3c }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_3579a24378ab417ea692387df9d91e3c }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 1 failed
      if: ${{ steps.login1.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 2)
      continue-on-error: true
      id: login2
      uses: azure/login@v2
      if: ${{ steps.login1.outcome=='failure' }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_3579a24378ab417ea692387df9d91e3c }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_3579a24378ab417ea692387df9d91e3c }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_3579a24378ab417ea692387df9d91e3c }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 2 failed
      if: ${{ steps.login2.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 3)
      continue-on-error: false
      id: login3
      uses: azure/login@v2
      if: ${{ steps.login2.outcome=='failure'  }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_3579a24378ab417ea692387df9d91e3c }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_3579a24378ab417ea692387df9d91e3c }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_3579a24378ab417ea692387df9d91e3c }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Checkout
      uses: actions/checkout@v3

    - name: Deploy Content to Microsoft Sentinel
      uses: azure/powershell@v2
      with:
        azPSVersion: 'latest'
        inlineScript: |
          ${{ github.workspace }}//.github/workflows/azure-sentinel-deploy-3579a243-78ab-417e-a692-387df9d91e3c.ps1