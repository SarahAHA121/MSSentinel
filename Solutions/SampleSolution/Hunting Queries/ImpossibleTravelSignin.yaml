id: 6e1d57a0-0f91-45c3-b7f8-6653b1aa4404
name: Impossible Travel Sign-in Activity
description: Hunting query to find potentially impossible travel between consecutive successful sign-ins.
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - SigninLogs
tactics:
  - DefenseEvasion
  - CredentialAccess
relevantTechniques:
  - T1078
query: |
  SigninLogs
  | where TimeGenerated >= ago(24h)
  | where ResultType == 0
  | project TimeGenerated, UserPrincipalName, IPAddress, Location, AppDisplayName
  | sort by UserPrincipalName asc, TimeGenerated asc
  | serialize
  | extend PrevUser = prev(UserPrincipalName), PrevTime = prev(TimeGenerated), PrevLocation = prev(Location), PrevIP = prev(IPAddress)
  | where UserPrincipalName == PrevUser
  | extend TimeDeltaMinutes = datetime_diff('minute', TimeGenerated, PrevTime)
  | where TimeDeltaMinutes < 120 and tostring(Location) != tostring(PrevLocation)
  | project UserPrincipalName, PrevTime, TimeGenerated, PrevLocation, Location, PrevIP, IPAddress, AppDisplayName, TimeDeltaMinutes
  | order by TimeGenerated desc
version: 1.0.0
kind: HuntingQuery
